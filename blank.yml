# This is a basic workflow to help you get started with Actions
cd: 
    name: Despliegue Blue-Green
    runs-on: ubuntu-latest
    needs: ci

    steps: 
      - name: Descargar codigo  # Descarga el contenido del repositorio
        uses: actions/checkout@v4 # Checkout v4: acción oficial de GitHub

      - name: Configurar Python # Configura la versión de python
        uses: actions/setup-python@v4 # Setup-python v4
        with: 
          python-version: "3.11" # Versión de python a utilizar

      - name: Iniciar version Blue
        run: |
          python app.py --version blue --puerto 8000
          2>&1 &.
          echo $! > blue.pid
          sleep 2

      - name: Iniciar version Green
        run: |
          python app.py --version green --puerto 8001
          2>&1 &.
          echo $! > green.pid
          sleep 2
