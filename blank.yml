# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    env: 
      platform: aws
      region: us-east-1
      account: development

      
    steps:
      - uses: actions/checkout@v4

      - name: Run a one-line script
        run: echo Hello, world!

      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

        #HolaMundo
      - name: Mostrar mensaje inicial
        run: echo "Hola Mundo"

        #Variables 
      - name: Auditoria de Variables de entorno 
        run: | 
         echo "Plataforma de despliegue: ${{ env.plataform }}"
         echo "Region de despliegue: ${{ env.region}}"
         echo "Cuenta de despliegue: ${{ env.account}}"

        #InspeccionProfunda
      - name: Debug del playload completo
        run: echo "${{ toJSON(github.event) }}"

        #Metadatos
      - name: Mostrar Metadatos Basicos
        run: |
         echo "Usuario ejecutor: ${{ github.actor }}"
         echo "Repositorio activo: ${{ github.repository }}"

      


