#Iniciar Green
cd-green:
    name: Iniciar Green
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo  # Descarga el contenido del repositorio
      uses: actions/checkout@v4 # Checkout v4: acción oficial de GitHub

    - name: Configurar Python # Configura la versión de python
      uses: actions/setup-python@v4 # Setup-python v4
      with:
        python-version: "3.11" # Versión de python a utilizar

    - name: Validar sintaxis de Python # Valida la sintaxis del código fuente
      run: python -m py_compile app.py 

    - name: Ejecutar prueba basica
      run: |
        python -c "from app import crear_servidor; print('Codigo valido')"

#Probar Green
    - name: Probar Green
    
      run: |
        echo "Probando la version Green"
        response=$(curl -s http://127.0.0.1:8001/health)
        echo "respuesta de Green: $response"
        if [[ "$respuesta" == *"Version Green"* ]]; then
        echo "La version Green esta funcionando correctamente"
        else
        echo "La version Green no esta funcionando correctamente"
        exit 1
        fi
        
      